[package]
name = "gitgui"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "A git GUI in the spirit of git-gui, with hunk- and line-level staging"
license = "MIT"

[features]
default = ["dialogs"]
# Native folder picker. Split out so cross-builds can drop it if the
# platform dialog crate fights the toolchain; the UI keeps a text-entry
# fallback either way.
dialogs = ["rfd"]

[dependencies]
eframe = { version = "0.32", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = "0.32"
rfd = { version = "0.15", optional = true }

[profile.release]
opt-level = 2
lto = "thin"
strip = true

[[bin]]
name = "gitgui"
path = "src/main.rs"
